name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private identity configuration
        env:
          IDANALYZER_KEY: ${{ secrets.IDANALYZER_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          key = os.environ.get("IDANALYZER_KEY", "").strip()
          if any(c in key for c in "\r\n"):
              raise SystemExit("Invalid identity secret format")
          path = Path("deploy/identity.env")
          path.touch(mode=0o600)
          path.write_text("IDANALYZER_REGION=eu\nIDANALYZER_KEY=" + key + "\n")
          PY
      - name: Ship to the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          tar -czf - --exclude .git --exclude node_modules . | ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new root@185.211.5.32 deploy
