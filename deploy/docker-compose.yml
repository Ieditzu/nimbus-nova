services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/nova.db
      NOVA_DEMO: "1"
    volumes:
      - nova-data:/data
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped


  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    ports:
      - "127.0.0.1:8092:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  nova-data:
