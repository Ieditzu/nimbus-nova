<!doctype html>
<html lang="ro" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101010" />
    <script>
      try {
        const theme = localStorage.getItem('nova-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101010' : '#fafafa';
        }
      } catch {}
    </script>
    <title>Nimbus Nova | Sarcini scurte, prin Nova</title>
    <meta name="description" content="Omul din mijloc dintre cine are timp și cine are o sarcină scurtă. Publică o sarcină și gestionează candidaturile prin Nimbus Nova. Demo pentru adulți." />
    <meta property="og:title" content="Nimbus Nova | Sarcini scurte, prin Nova" />
    <meta property="og:description" content="Cineva are timp. Tu ai o sarcină. Nova vă aduce împreună într-un demo pentru adulți." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ro_RO" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
